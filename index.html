        }

        const approvedUser = approvedUsers.find((u) => u.email === email);
        const pendingUser = pendingUsers.find((u) => u.email === email);
        if (approvedUser) {
          setCurrentUser(approvedUser);
          setRole(approvedUser.role);
          addNotification(`ログインしました。お帰りなさい、${approvedUser.name} 様！`);
          showToast(`ログインしました (${approvedUser.name})`);
        } else if (pendingUser) {
          setCurrentUser(pendingUser);
        } else {
          alert("ログイン情報が間違っているか、アカウントが見つかりません。");
        }
      }

      function handleApproveUser(userId) {
        const userToApprove = pendingUsers.find((u) => u.id === userId);
        if (userToApprove) {
          const approved = { ...userToApprove, status: "approved" };
          setApprovedUsers((prev) => [...prev, approved]);
          setPendingUsers((prev) => prev.filter((u) => u.id !== userId));
          if (currentUser && currentUser.id === userId) {
            setCurrentUser(approved);
          }

          if (supabaseClient) {
            supabaseClient.from("users").update({ status: "approved" }).eq("id", userId).catch(() => {});
          }

          addNotification(`アカウント (${userToApprove.name}) が承認されました！`);
          showToast(`📧 承認完了通知メールを ${userToApprove.email} へ送信しました！`);
        }
      }

      function handleToggleSuspendUser(user) {
        const nextStatus = user.status === "suspended" ? "approved" : "suspended";
        setApprovedUsers((prev) => prev.map((u) => u.id === user.id ? { ...u, status: nextStatus } : u));
        if (currentUser && currentUser.id === user.id) {
          setCurrentUser({ ...currentUser, status: nextStatus });
        }
        showToast(nextStatus === "suspended" ? `アカウント (${user.name}) を凍結しました` : `アカウント (${user.name}) の凍結を解除しました`);
      }

      function exportDatabaseJSON() {
        downloadFile(
          `Cloud_DB_SeedData_${new Date().toISOString().slice(0, 10)}.json`,
          JSON.stringify({ version: "1.0.0", exportedAt: new Date().toISOString(), data: { campaigns, approvedUsers, pendingUsers } }, null, 2),
          "application/json"
        );
        showToast("☁️ バックエンドクラウドDB用 JSONシードデータを出力しました！");
      }

      const filtered = useMemo(() => {
        let list = campaigns.filter((c) => {
          if (activeCategory === "favorites" && !favoriteIds.has(c.id)) return false;
          const matchCat = activeCategory === "all" || activeCategory === "favorites" || c.category === activeCategory;
          const matchQuery = !query || c.title.includes(query) || c.brand.includes(query);
          return matchCat && matchQuery;
        });

        return list.sort((a, b) => {
          if (sortBy === "valueDesc") return b.value - a.value;
          if (sortBy === "deadlineAsc") return a.deadline.localeCompare(b.deadline);
          if (sortBy === "slotsAsc") return (a.slotsTotal - a.slotsFilled) - (b.slotsTotal - b.slotsFilled);
          return b.id.localeCompare(a.id);
        });
      }, [campaigns, activeCategory, favoriteIds, query, sortBy]);

      const isRequesterLoggedIn = currentUser && currentUser.role === "requester" && currentUser.status === "approved";

      return (
        <LangContext.Provider value={{ lang, t }}>
          <div className="mg-app">
            <style>{GLOBAL_STYLES}</style>

            {toastMsg && <div className="mg-toast">{toastMsg}</div>}

            {showAuthModal && (
              <AuthModal
                onClose={() => setShowAuthModal(false)}
                onRegisterSubmit={handleRegisterSubmit}
                onLoginSubmit={handleLoginSubmit}
              />
            )}

            {showCreateModal && (
              <CreateCampaignModal
                onClose={() => setShowCreateModal(false)}
                onCreateSubmit={handleCreateCampaign}
                currentUserName={currentUser ? currentUser.companyName || currentUser.name : ""}
              />
            )}

            {showPWAModal && <PWAModal onClose={() => setShowPWAModal(false)} />}

            <header className="mg-header">
              <div className="mg-logo"><span className="mg-logo-mark"><ScrollText size={16} strokeWidth={2} /></span>モニターGUILD</div>
              <div className="mg-header-right">
                <div className="mg-lang-toggle">
                  <button className={lang === "ja" ? "active" : ""} onClick={() => setLang("ja")}>日本語</button>
                  <button className={lang === "zh" ? "active" : ""} onClick={() => setLang("zh")}>中文</button>
                </div>

                <div className="mg-role-tabs">
                  <button className={role === "monitor" ? "active" : ""} onClick={() => setRole("monitor")}><UserCircle2 size={13}/> {t("roleMonitor")}</button>
                  <button className={role === "requester" ? "active" : ""} onClick={() => setRole("requester")}><Crown size={13}/> {t("roleRequester")}</button>
                  {currentUser && currentUser.role === "admin" && (
                    <button className={role === "admin" ? "active" : ""} onClick={() => setRole("admin")}><ShieldCheck size={13}/> 管理パネル ({pendingUsers.length})</button>
                  )}
                </div>

                {isRequesterLoggedIn && (
                  <button className="mg-auth-btn" style={{ background: "#0d9488" }} onClick={() => setShowCreateModal(true)}>
                    <PlusCircle size={14}/> ＋ 案件を投稿する
                  </button>
                )}

                <button className="mg-bell-btn" onClick={() => setShowNotifications(!showNotifications)}>
                  <Bell size={15}/>
                  {notifications.length > 0 && <span className="mg-bell-badge" />}
                </button>

                {showNotifications && (
                  <div className="mg-notif-dropdown">
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #e2e8f0", paddingBottom: 6 }}>
                      <strong style={{ fontSize: 13 }}>お知らせ通知 ({notifications.length})</strong>
                      <button style={{ background: "transparent", border: "none", color: "var(--ink-muted)", cursor: "pointer" }} onClick={() => setShowNotifications(false)}><X size={14}/></button>
                    </div>
                    {notifications.map((n) => (
                      <div key={n.id} className="mg-notif-item">{n.text}</div>
                    ))}
                  </div>
                )}

                <button className="mg-auth-btn-ghost" onClick={() => setShowPWAModal(true)}><Smartphone size={13}/> PWA</button>

                {currentUser ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 12, color: currentUser.role === "admin" ? "var(--teal)" : currentUser.status === "approved" ? "var(--gold-soft)" : "var(--terracotta)" }}>
                      {currentUser.role === "admin" ? "🔑 管理者" : currentUser.status === "approved" ? "👤 " + currentUser.name : currentUser.status === "suspended" ? "🚫 凍結: " + currentUser.name : "⏳ 承認待ち: " + currentUser.name}
                    </span>
                    <button className="mg-auth-btn-ghost" onClick={() => { setCurrentUser(null); setRole("monitor"); localStorage.removeItem("mg_current_user"); }}><LogOut size={12}/> {t("btnLogout")}</button>
                  </div>
                ) : (
                  <button className="mg-auth-btn" onClick={() => setShowAuthModal(true)}><LogIn size={13}/> {t("btnLogin")}</button>
                )}
              </div>
            </header>

            {currentUser && currentUser.status === "suspended" && role !== "admin" ? (
              <div className="mg-suspended-banner">
                <div style={{ width: 64, height: 64, borderRadius: "50%", border: "2px solid #ef4444", display: "flex", alignItems: "center", justifyCenter: "center", margin: "0 auto 16px", color: "#ef4444", background: "#ffffff" }}>
                  <Ban size={32} />
                </div>
                <h2 style={{ margin: "0 0 10px", fontSize: 20 }}>{t("suspendedTitle")}</h2>
                <p style={{ fontSize: 13.5, margin: 0 }}>{t("suspendedSub")}</p>
              </div>
            ) : currentUser && currentUser.status === "pending" && role !== "admin" ? (
              <div className="mg-pending-banner">
                <div style={{ width: 64, height: 64, borderRadius: "50%", border: "2px solid #d97706", display: "flex", alignItems: "center", justifyCenter: "center", margin: "0 auto 16px", color: "#d97706", background: "#fffbeb" }}>
                  <Hourglass size={32} />
                </div>
                <h2 style={{ margin: "0 0 10px", fontSize: 20 }}>{t("pendingApprovalTitle")}</h2>
                <p style={{ fontSize: 13.5, color: "var(--ink-muted)", margin: 0 }}>{t("pendingApprovalSub")}</p>
              </div>
            ) : role === "admin" && currentUser && currentUser.role === "admin" ? (
              <section className="mg-board">
                <div className="mg-board-head">
                  <h2 className="mg-board-title"><ShieldCheck size={18}/> 管理パネル - クラウドDB ＆ 会員審査</h2>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="mg-auth-btn-ghost" onClick={exportDatabaseJSON}><Database size={14}/> {t("btnExportDBJSON")}</button>
                    <button className="mg-auth-btn" onClick={() => downloadFile("PR_Report.csv", "ID,Title\n1,Demo", "text/csv")}><DownloadCloud size={14}/> {t("btnExportCSV")}</button>
                  </div>
                </div>

                <div style={{ background: "#ccfbf1", border: "1px solid #99f6e4", borderRadius: 10, padding: "10px 14px", fontSize: 12, color: "#0f766e", display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
                  <Database size={15}/> クラウドバックエンドDB通信ステータス: <b>{cloudStatus}</b>
                </div>

                <h3 style={{ fontSize: 15, color: "#0f172a", margin: "20px 0 10px" }}>① 会員登録 承認待ち一覧 ({pendingUsers.length})</h3>
                {pendingUsers.length === 0 ? (
                  <div className="mg-empty" style={{ padding: 20 }}><CheckCircle2 size={24}/><p>現在、承認待ちの登録申請はありません。</p></div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {pendingUsers.map((u) => (
                      <div key={u.id} style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: 12, padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <p style={{ margin: 0, fontWeight: 600, fontSize: 14, color: "#0f172a" }}>{u.name} <span style={{ fontSize: 11, color: "#0f766e", background: "#ccfbf1", padding: "2px 8px", borderRadius: 10, marginLeft: 6 }}>{u.role === "monitor" ? "モニター" : "依頼企業"}</span></p>
                          <p style={{ margin: "2px 0 0", fontSize: 12, color: "var(--ink-muted)" }}>{u.email} {u.sns && "・ " + u.sns}</p>
                        </div>
                        <button className="mg-auth-btn" onClick={() => handleApproveUser(u.id)}><ThumbsUp size={13}/> {t("adminApproveBtn")}</button>
                      </div>
                    ))}
                  </div>
                )}

                <h3 style={{ fontSize: 15, color: "#0f172a", margin: "30px 0 10px" }}>② 承認済み会員・リスク管理 ({approvedUsers.length})</h3>
                {approvedUsers.length === 0 ? (
                  <div className="mg-empty" style={{ padding: 20 }}><p>まだ承認済み会員はいません。</p></div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {approvedUsers.map((u) => (
                      <div key={u.id} style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: 12, padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <p style={{ margin: 0, fontWeight: 600, fontSize: 14, color: "#0f172a" }}>{u.name} <span style={{ fontSize: 11, color: u.status === "suspended" ? "#e11d48" : "#0d9488", marginLeft: 6 }}>{u.status === "suspended" ? "🚫 凍結中" : "✅ 承認済み"}</span></p>
                          <p style={{ margin: "2px 0 0", fontSize: 12, color: "var(--ink-muted)" }}>{u.email}</p>
                        </div>
                        <button className={u.status === "suspended" ? "mg-auth-btn" : "mg-auth-btn-ghost"} style={u.status !== "suspended" ? { color: "#e11d48", borderColor: "#fca5a5" } : {}} onClick={() => handleToggleSuspendUser(u)}>
                          <Ban size={13}/> {u.status === "suspended" ? t("adminUnbanBtn") : t("adminBanBtn")}
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            ) : (
              <>
                <section className="mg-news-section">
                  <div className="mg-news-box">
                    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600, color: "#0f766e" }}>
                      <Megaphone size={15}/> 運営からのお知らせ
                    </div>
                    {NEWS_LIST.map((n) => (
                      <div key={n.id} className="mg-news-item">
                        <span className="mg-news-tag">{n.tag}</span>
                        <span style={{ color: "var(--ink-muted)", fontSize: 11 }}>{n.date}</span>
                        <span style={{ flex: 1, textOverflow: "ellipsis", overflow: "hidden", whiteSpace: "nowrap" }}>{n.title}</span>
                      </div>
                    ))}
                  </div>
                </section>

                <section className="mg-hero">
                  <span className="mg-hero-badge"><ShieldCheck size={13}/> {t("heroBadge")}</span>
                  <h1>{t("heroTitleA")}<em>{t("heroTitleEm")}</em>{t("heroTitleB")}</h1>
                  <p>{t("heroDesc")}</p>

                  {isRequesterLoggedIn && (
                    <div style={{ marginTop: 20 }}>
                      <button className="mg-auth-btn" style={{ margin: "0 auto", padding: "12px 24px", fontSize: 14, background: "#0d9488" }} onClick={() => setShowCreateModal(true)}>
                        <PlusCircle size={18}/> ＋ 新しいPRモニター依頼を作成・掲載する
                      </button>
                    </div>
                  )}
                </section>

                <div className="mg-ribbon"><ShieldCheck size={14}/> {t("ribbon")}</div>

                <section className="mg-board">
                  <div className="mg-board-head">
                    <h2 className="mg-board-title"><ScrollText size={18}/> {t("boardTitle")}</h2>
                    <div className="mg-controls">
                      {isRequesterLoggedIn && (
                        <button className="mg-auth-btn-ghost" style={{ background: "#f0fdf4", borderColor: "#99f6e4", color: "#0f766e" }} onClick={() => setShowCreateModal(true)}>
                          <PlusCircle size={14}/> ＋ 依頼を追加
                        </button>
                      )}
                      <div className="mg-search"><Search size={14} color="#64748b" /><input placeholder={t("searchPlaceholder")} value={query} onChange={(e) => setQuery(e.target.value)} /></div>
                      <select className="mg-sort-select" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                        <option value="newest">{t("sortNewest")}</option>
                        <option value="valueDesc">{t("sortValueDesc")}</option>
                        <option value="deadlineAsc">{t("sortDeadlineAsc")}</option>
                        <option value="slotsAsc">{t("sortSlotsAsc")}</option>
                      </select>
                    </div>
                  </div>
                  <div className="mg-chips">
                    <button className={"mg-chip" + (activeCategory === "all" ? " active" : "")} onClick={() => setActiveCategory("all")}>{t("chipAll")}</button>
                    <button className={"mg-chip" + (activeCategory === "favorites" ? " active" : "")} onClick={() => setActiveCategory("favorites")}><Heart size={13}/> {t("chipFavorites")}</button>
                    {Object.entries(CATEGORY_META).map(([k, v]) => (
                      <button key={k} className={"mg-chip" + (activeCategory === k ? " active" : "")} onClick={() => setActiveCategory(k)}>{React.createElement(v.icon, { size: 13 })} {v[lang]}</button>
                    ))}
                  </div>
                  <div className="mg-grid">
                    {filtered.map((c) => {
                      const CatIcon = CATEGORY_META[c.category].icon;
                      const PlatIcon = PLATFORM_META[c.platform].icon;
                      const rarity = rarityFromValue(c.value);
                      const isFavorite = favoriteIds.has(c.id);

                      return (
                        <div key={c.id} className="mg-card" style={{ "--ring": RARITY_META[rarity].ring, "--glow": RARITY_META[rarity].glow }}>
                          <div className="mg-card-top">
                            <div className="mg-card-icon"><CatIcon size={22} strokeWidth={1.6} /></div>
                            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                              <button className={"mg-card-fav" + (isFavorite ? " active" : "")} onClick={(e) => { e.stopPropagation(); toggleFavorite(c.id); }}>
                                <Heart size={16} fill={isFavorite ? "#e11d48" : "none"} />
                              </button>
                              <span className="mg-rarity" style={{ "--r": RARITY_META[rarity].ring }}>{RARITY_META[rarity][lang]}</span>
                            </div>
                          </div>
                          <h3 className="mg-card-title">{c.title}</h3>
                          <p className="mg-card-brand">{c.brand}</p>
                          <div className="mg-card-stats">
                            <span><Coins size={14} strokeWidth={1.8} /> {t("value")} ¥{c.value.toLocaleString()}</span>
                            <span><PlatIcon size={14} strokeWidth={1.8} /> {PLATFORM_META[c.platform].label}</span>
                          </div>
                          <div className="mg-card-foot">
                            <span className="mg-slots"><Users size={13} strokeWidth={1.8} /> {c.slotsTotal - c.slotsFilled}/{c.slotsTotal} {t("slots")}</span>
                            <span className="mg-deadline"><Clock size={13} strokeWidth={1.8} /> 〜{c.deadline.slice(5).replace("-", "/")}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            )}

            <footer className="mg-footer">
              <p>{t("footer1")}</p>
              <p>{t("footer2")}</p>
              <p>{t("footer3")}</p>
            </footer>
          </div>
        </LangContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<MonitorGuildApp />);
  </script>
</body>
</html>
